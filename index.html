<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>代课单</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f4f6;
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif;
  color:#111827;
}
.header{
  background:#1677ff;
  color:#fff;
  padding:18px 14px;
  text-align:center;
}
.header h1{
  margin:0;
  font-size:24px;
  letter-spacing:1px;
}
.header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.92;
}
.container{
  max-width:1180px;
  margin:0 auto;
  padding:12px;
  display:grid;
  grid-template-columns:400px 1fr;
  gap:12px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}
.card h2{
  margin:0 0 12px;
  font-size:18px;
}
label{
  display:block;
  margin:10px 0 5px;
  font-size:14px;
  color:#374151;
}
input,select,textarea{
  width:100%;
  border:1px solid #d7dce4;
  border-radius:12px;
  padding:11px 12px;
  font-size:16px;
  outline:none;
  background:#fff;
}
input:focus,select:focus,textarea:focus{
  border-color:#1677ff;
}
textarea{
  min-height:76px;
  resize:vertical;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.type-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.type{
  border:1px solid #d7dce4;
  border-radius:12px;
  text-align:center;
  padding:10px 6px;
  cursor:pointer;
  user-select:none;
  font-size:15px;
  transition:.2s;
}
.type.active{
  background:#1677ff;
  color:#fff;
  border-color:#1677ff;
}
.btn{
  border:0;
  border-radius:14px;
  padding:13px 14px;
  font-size:16px;
  color:#fff;
  cursor:pointer;
}
.btn-main{background:#1677ff}
.btn-green{background:#16a34a}
.btn-gray{background:#6b7280}
.btn-red{background:#dc2626}
.btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.big-btn{
  width:100%;
  margin-top:12px;
  height:52px;
  font-size:17px;
}
.list{
  margin-top:12px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
}
.item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  padding:10px;
  border-bottom:1px solid #eee;
  font-size:14px;
}
.item:last-child{border-bottom:0}
.del{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  border-radius:8px;
  padding:6px 10px;
}
.preview{
  overflow:auto;
}

/* 下面这一段专门控制“生成出来的代课单样式” */
#sheet{
  width:794px;
  min-height:1123px;
  margin:0 auto;
  background:#fff;
  color:#000;
  padding:30px 30px 26px;
  font-family:"SimSun","宋体",serif;
  font-size:16px;
  line-height:1.85;
}
#sheet *{
  font-family:"SimSun","宋体",serif !important;
}
#sheet h1{
  text-align:center;
  margin:0 0 10px;
  font-size:26px;
  line-height:1.4;
  font-weight:400;
  letter-spacing:2px;
}
.p{
  font-size:16px;
  line-height:1.95;
  margin:0;
}
.indent{
  text-indent:2em;
}
.u{
  display:inline-block;
  border-bottom:1px solid #000;
  min-width:54px;
  height:22px;
  line-height:22px;
  text-align:center;
  padding:0 3px;
  vertical-align:baseline;
}
.u.long{min-width:170px}
.u.mid{min-width:96px}
.note{font-weight:700}
.sign{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:2px;
}
#sheet table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin-top:4px;
  font-size:14px;
  line-height:1.25;
}
#sheet th,#sheet td{
  border:1px solid #000;
  text-align:center;
  vertical-align:middle;
  height:37px;
  padding:2px 1px;
  word-break:break-all;
  font-weight:400;
}
#sheet th{
  height:58px;
}
.top-action{
  position:sticky;
  top:0;
  z-index:30;
  background:#f3f4f6;
  padding-bottom:10px;
}
@media(max-width:900px){
  .container{
    display:block;
    padding:10px;
  }
  .card{
    margin-bottom:12px;
  }
  .preview{
    display:none;
  }
  .type-grid{
    grid-template-columns:repeat(3,1fr);
  }
}
@media print{
  @page{
    size:A4 portrait;
    margin:0;
  }
  body{background:#fff}
  .header,.form-side{display:none!important}
  .container{display:block;padding:0;max-width:none}
  .card{box-shadow:none;padding:0;margin:0}
  .preview{display:block;overflow:visible}
  #sheet{
    width:210mm;
    height:297mm;
    min-height:297mm;
    padding:10mm 8mm 8mm;
    margin:0 auto;
    font-size:16px;
    line-height:1.85;
  }
  #sheet h1{
    font-size:26px;
    margin-bottom:8px;
  }
  .p{
    font-size:16px;
    line-height:1.9;
  }
  #sheet table{
    font-size:14px;
  }
  #sheet th,#sheet td{
    height:36px;
  }
  #sheet th{
    height:56px;
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>代课单</h1>
  <p>手机填写 → 自动生成标准代课单</p>
</div>

<div class="container">

<div class="card form-side">

<div class="top-action">
<button class="btn btn-main big-btn" onclick="renderSheet();window.print()">生成PDF / 保存图片</button>
</div>

<h2>请假信息</h2>

<label>请假原因</label>
<textarea id="reason" placeholder="请输入请假原因"></textarea>

<label>请假类型</label>
<div class="type-grid">
  <div class="type active" data-v="公假">公假</div>
  <div class="type" data-v="事假">事假</div>
  <div class="type" data-v="病假">病假</div>
  <div class="type" data-v="婚假">婚假</div>
  <div class="type" data-v="丧假">丧假</div>
  <div class="type" data-v="产假">产假</div>
  <div class="type" data-v="护理假">护理假</div>
</div>

<div class="grid2">
<div>
<label>请假天数</label>
<input id="days" placeholder="例如：1">
</div>
<div>
<label>请假人</label>
<input id="person" placeholder="姓名">
</div>
</div>

<div class="grid2">
<div>
<label>开始日期</label>
<input id="startDate" type="date">
</div>
<div>
<label>结束日期</label>
<input id="endDate" type="date">
</div>
</div>

<div class="grid2">
<div>
<label>开始周次</label>
<input id="startWeek" placeholder="例如：14">
</div>
<div>
<label>结束周次</label>
<input id="endWeek" placeholder="例如：14">
</div>
</div>

<div class="grid2">
<div>
<label>开始星期</label>
<select id="startDay">
<option>一</option><option>二</option><option>三</option><option>四</option><option>五</option><option>六</option><option>日</option>
</select>
</div>
<div>
<label>结束星期</label>
<select id="endDay">
<option>一</option><option>二</option><option>三</option><option>四</option><option>五</option><option>六</option><option>日</option>
</select>
</div>
</div>

<div class="grid2">
<div>
<label>填写日期</label>
<input id="fillDate" type="date">
</div>
<div>
<label>代课周次</label>
<input id="tableWeek" placeholder="例如：14">
</div>
</div>

<label>教务处签字</label>
<input id="sign" placeholder="可留空">

<h2 style="margin-top:20px">添加代课安排</h2>

<div class="grid2">
<div>
<label>星期</label>
<select id="cday">
<option>星期一</option>
<option>星期二</option>
<option>星期三</option>
<option>星期四</option>
<option>星期五</option>
</select>
</div>
<div>
<label>节次</label>
<select id="cperiod">
<option>早自习</option>
<option>第1节</option>
<option>第2节</option>
<option>第3节</option>
<option>第4节</option>
<option>第5节</option>
<option>第6节</option>
<option>第7节</option>
<option>第8节</option>
<option>自主1</option>
<option>自主2</option>
<option>自主3</option>
</select>
</div>
</div>

<div class="grid2">
<div>
<label>班级</label>
<input id="cls" placeholder="例如：初一1班">
</div>
<div>
<label>代课教师</label>
<input id="teacher" placeholder="例如：李老师">
</div>
</div>

<button class="btn btn-green big-btn" onclick="addItem()">添加这一节</button>

<div class="list" id="list"></div>

<div class="btns">
<button class="btn btn-gray" onclick="saveData()">保存内容</button>
<button class="btn btn-gray" onclick="loadData()">恢复内容</button>
</div>

<button class="btn btn-red big-btn" onclick="clearAll()">清空重填</button>

</div>

<div class="card preview">
<div id="sheet"></div>
</div>

</div>

<script>
let leaveType="公假";
let arr=[];

const days=["星期一","星期二","星期三","星期四","星期五"];
const periods=["早自习","第1节","第2节","第3节","第4节","第5节","第6节","第7节","第8节","自主1","自主2","自主3"];

function v(id){return document.getElementById(id).value.trim();}

document.querySelectorAll(".type").forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll(".type").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    leaveType=el.dataset.v;
    renderSheet();
  };
});

function datePart(s){
  if(!s)return {m:"",d:""};
  let a=s.split("-");
  return {m:Number(a[1]),d:Number(a[2])};
}

function addItem(){
  const item={
    day:v("cday"),
    period:v("cperiod"),
    cls:v("cls"),
    teacher:v("teacher")
  };

  if(!item.cls&&!item.teacher){
    alert("请填写班级或代课教师");
    return;
  }

  const old=arr.findIndex(x=>x.day===item.day&&x.period===item.period);

  if(old>=0) arr[old]=item;
  else arr.push(item);

  document.getElementById("cls").value="";
  document.getElementById("teacher").value="";

  renderList();
  renderSheet();
}

function renderList(){
  const box=document.getElementById("list");

  if(arr.length===0){
    box.innerHTML='<div class="item">还没有添加代课安排</div>';
    return;
  }

  box.innerHTML=arr.map((x,i)=>`
    <div class="item">
      <div>${x.day} ${x.period}<br>${x.cls} → ${x.teacher}</div>
      <button class="del" onclick="delItem(${i})">删除</button>
    </div>
  `).join("");
}

function delItem(i){
  arr.splice(i,1);
  renderList();
  renderSheet();
}

function getCell(day,period,type){
  const x=arr.find(a=>a.day===day&&a.period===period);
  if(!x)return "";
  return type==="class"?x.cls:x.teacher;
}

function checked(t){
  return leaveType===t?"☑":"□";
}

function renderSheet(){

  const sd=datePart(v("startDate"));
  const ed=datePart(v("endDate"));
  const fd=datePart(v("fillDate"));

  let rows="";

  days.forEach(day=>{
    rows+=`<tr><td rowspan="2">${day}</td><td>班级</td>`;

    periods.forEach(p=>{
      rows+=`<td>${getCell(day,p,"class")}</td>`;
    });

    rows+=`</tr><tr><td>代课教师</td>`;

    periods.forEach(p=>{
      rows+=`<td>${getCell(day,p,"teacher")}</td>`;
    });

    rows+=`</tr>`;
  });

  document.getElementById("sheet").innerHTML=`
  <h1>代课单</h1>

  <div class="p">学校领导：</div>

  <div class="p indent">
  本人确因 <span class="u long">${v("reason")}</span>，
  特请（${checked("公假")}公、${checked("事假")}事、${checked("病假")}病、${checked("婚假")}婚、${checked("丧假")}丧、${checked("产假")}产、${checked("护理假")}护理）假
  <span class="u">${v("days")}</span> 天。
  请假 <span class="u">${sd.m||""}</span> 月 <span class="u">${sd.d||""}</span> 日
  （第 <span class="u">${v("startWeek")}</span> 周星期 <span class="u">${v("startDay")}</span>）
  至
  <span class="u">${ed.m||""}</span> 月 <span class="u">${ed.d||""}</span> 日
  （第 <span class="u">${v("endWeek")}</span> 周星期 <span class="u">${v("endDay")}</span>）止。
  望准假！（住院病必须提供住院相关依据，<span class="note">请假人自己安排好班级代课老师，出现缺代记请假人的课。</span>）
  </div>

  <div class="p">
  教务处签字：<span class="u long">${v("sign")}</span>
  </div>

  <div class="sign p">
  <span>请假人：<span class="u mid">${v("person")}</span></span>
  <span>${fd.m||""} 月 ${fd.d||""} 日</span>
  </div>

  <div class="p">请假人代课人员安排表：第 <span class="u">${v("tableWeek")}</span> 周</div>

  <table>
  <tr>
  <th style="width:54px">星期<br>节次</th>
  <th style="width:58px"></th>
  <th>早自习</th>
  <th>第1节</th>
  <th>第2节</th>
  <th>第3节</th>
  <th>第4节</th>
  <th>第5节</th>
  <th>第6节</th>
  <th>第7节</th>
  <th>第8节</th>
  <th>自主1</th>
  <th>自主2</th>
  <th>自主3</th>
  </tr>

  ${rows}

  </table>
  `;
}

function saveData(){
  const data={
    leaveType,
    arr,
    fields:{
      reason:v("reason"),
      days:v("days"),
      person:v("person"),
      startDate:v("startDate"),
      endDate:v("endDate"),
      startWeek:v("startWeek"),
      endWeek:v("endWeek"),
      startDay:v("startDay"),
      endDay:v("endDay"),
      fillDate:v("fillDate"),
      tableWeek:v("tableWeek"),
      sign:v("sign")
    }
  };

  localStorage.setItem("daikeData",JSON.stringify(data));
  alert("已保存");
}

function loadData(){
  const raw=localStorage.getItem("daikeData");

  if(!raw){
    alert("没有保存记录");
    return;
  }

  const data=JSON.parse(raw);

  leaveType=data.leaveType||"公假";
  arr=data.arr||[];

  Object.entries(data.fields||{}).forEach(([k,vv])=>{
    const el=document.getElementById(k);
    if(el)el.value=vv;
  });

  document.querySelectorAll(".type").forEach(x=>{
    x.classList.toggle("active",x.dataset.v===leaveType);
  });

  renderList();
  renderSheet();
}

function clearAll(){
  if(!confirm("确定清空吗？"))return;

  document.querySelectorAll("input,textarea").forEach(x=>x.value="");

  arr=[];

  leaveType="公假";

  document.querySelectorAll(".type").forEach((x,i)=>{
    x.classList.toggle("active",i===0);
  });

  renderList();
  renderSheet();
}

[
"reason","days","person","startDate","endDate",
"startWeek","endWeek","startDay","endDay",
"fillDate","tableWeek","sign"
].forEach(id=>{
  document.getElementById(id).addEventListener("input",renderSheet);
  document.getElementById(id).addEventListener("change",renderSheet);
});

renderList();
renderSheet();
</script>

</body>
</html>
