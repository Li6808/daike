<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>代课单助手</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f7fb;--card:#ffffff;--soft:#f7f9fd;--line:#e8edf5;
  --text:#111827;--muted:#7b8494;--blue:#007aff;--green:#34c759;--red:#ff3b30;
  --shadow:0 12px 32px rgba(15,23,42,.08)
}
body{
  margin:0;min-height:100vh;
  background:linear-gradient(180deg,#eef5ff,#f7f9fc 42%,#f5f7fb);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Microsoft YaHei",Arial,sans-serif;
  color:var(--text)
}
.wrap{max-width:1060px;margin:0 auto;padding:14px;overflow-x:hidden}
.card{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.8);
  border-radius:26px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  overflow:hidden
}
h1{text-align:left;font-size:30px;line-height:1.1;margin:4px 0 6px;font-weight:900;letter-spacing:-.8px}
h1::after{content:"请假、课表、代课安排一页搞定";display:block;margin-top:8px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
h2{font-size:22px;margin:22px 0 12px;font-weight:900;letter-spacing:-.4px}
label{display:block;font-size:14px;font-weight:800;margin:0 0 7px;color:#1f2937}
input,select,textarea{
  width:100%;max-width:100%;border:1px solid var(--line);border-radius:18px;
  padding:13px 14px;font-size:16px;outline:none;background:#fff;min-height:50px;
  display:block;appearance:none;-webkit-appearance:none
}
input[type=date]{min-width:0;width:100%;max-width:100%;padding-right:10px}
input:focus,select:focus,textarea:focus{border-color:rgba(0,122,255,.55);box-shadow:0 0 0 4px rgba(0,122,255,.10)}
textarea{min-height:108px;resize:vertical}

.form-panel{
  background:rgba(255,255,255,.72);
  border:1px solid var(--line);
  border-radius:24px;
  padding:16px;
}
.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
}
.form-row:last-child{margin-bottom:0}
.field.full{grid-column:1/-1}
.field{min-width:0}
.section-line{
  height:1px;background:var(--line);margin:4px 0 16px
}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.help{font-size:13px;color:var(--muted);line-height:1.65;margin:8px 0 12px}
.btn{border:0;border-radius:18px;min-height:50px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.08)}
.blue{background:linear-gradient(180deg,#1688ff,#007aff);color:#fff}
.green{background:linear-gradient(180deg,#3ddc75,#34c759);color:#fff}
.gray{background:#eef2f7;color:#1f2937}
.red{background:rgba(255,59,48,.12);color:#b42318;box-shadow:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.table-wrap{overflow:auto;border-radius:18px;border:1px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--line);text-align:center;padding:7px}
th{background:#f4f7fb;font-weight:900}
.schedule-table input{border:0;border-radius:10px;padding:4px;min-height:34px;text-align:center;background:transparent;font-size:13px}
.period-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tag{padding:8px 11px;border-radius:999px;background:rgba(52,199,89,.12);color:#166534;border:1px solid rgba(52,199,89,.25);font-weight:800;font-size:14px}
.item{display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(52,199,89,.10);border:1px solid rgba(52,199,89,.22);border-radius:18px;padding:10px;margin:8px 0;font-weight:800}
.item input{max-width:150px;min-height:40px;font-size:15px}.del{border:0;border-radius:14px;background:rgba(255,59,48,.14);color:#b42318;padding:8px 10px;font-weight:900}
.settings-box{
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(255,255,255,.70);
  padding:14px;
  margin:12px 0 18px
}
.settings-box summary{font-weight:900;font-size:17px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.settings-box summary::-webkit-details-marker{display:none}
.settings-box summary::after{content:"展开";color:var(--blue);background:rgba(0,122,255,.09);border-radius:999px;padding:6px 10px;font-size:13px}
.settings-box[open] summary::after{content:"收起"}
.compact-title{font-size:17px;margin:16px 0 10px;font-weight:900}
details:not(.settings-box){border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff}
details:not(.settings-box) summary{font-weight:900;font-size:16px;cursor:pointer}
.preview{overflow:auto}

/* 生成代课单 */
#sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#000;padding:34px 42px 28px;font-family:"SimSun","宋体","Songti SC",serif;font-size:17px;line-height:1.9;border-radius:0}
#sheet *{font-family:"SimSun","宋体","Songti SC",serif!important}
#sheet h1{text-align:center;font-size:30px;font-weight:400;letter-spacing:3px;margin:0 0 16px}
#sheet h1::after{display:none}
.p{margin:0;font-size:17px;line-height:1.95;word-break:break-all;overflow-wrap:anywhere}.indent{text-indent:2em}
.u{display:inline-flex;justify-content:center;align-items:flex-end;min-width:58px;height:23px;line-height:23px;border-bottom:1px solid #000;text-align:center;padding:0 4px;vertical-align:baseline;text-indent:0}
.u.long{min-width:132px;max-width:170px}.u.mid{min-width:100px}.u.short{min-width:42px}.sign{display:flex;justify-content:space-between;gap:20px}.note{font-weight:700}
#sheet table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:6px;font-size:12px;line-height:1.2}
#sheet th,#sheet td{border:1px solid #000;height:34px;padding:1px;text-align:center;vertical-align:middle;word-break:break-all;overflow-wrap:anywhere;font-weight:400}
#sheet th{height:58px}

@media(max-width:760px){
  .wrap{padding:12px}.card{border-radius:24px;padding:16px}h1{font-size:28px}
  .grid2,.grid4,.actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .preview{display:none}.schedule-table{min-width:760px}
  input,select,textarea{font-size:16px;width:100%;max-width:100%}
}
@media(max-width:430px){
  .form-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
  .form-row.single{grid-template-columns:1fr}
  .grid2,.grid4,.actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  input[type=date]{padding-right:8px}
}
@media(max-width:360px){
  .form-row{grid-template-columns:1fr}
}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}.card:not(.preview){display:none!important}.wrap{padding:0;max-width:none}
  .preview{display:block!important;box-shadow:none;padding:0;margin:0;border-radius:0;overflow:visible}
  #sheet{width:210mm;height:297mm;min-height:297mm;padding:10mm 11mm 8mm}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>代课单助手</h1>

<details class="settings-box">
<summary>课表设置：节次 / 快速录入 / 我的课表</summary>
<div class="help">这些不是每天都要改，默认收起。需要修改课表、增加晚自习、重新录入课表时再展开。</div>

<h3 class="compact-title">节次管理</h3>
<div class="help">以后课表变了，不用改代码。这里可以添加“晚1、晚2、晚3、晚4”等节次。</div>
<div class="grid2"><div><label>新增节次</label><input id="newPeriod" placeholder="例如：晚1"></div><div style="display:flex;align-items:end"><button class="btn blue" style="width:100%" onclick="addPeriod()">添加节次</button></div></div>
<div class="period-list" id="periodList"></div>
<div class="actions"><button class="btn gray" onclick="saveAll()">保存全部</button><button class="btn red" onclick="resetPeriods()">恢复默认节次</button></div>

<h3 class="compact-title">快速录入课表</h3>
<details open><summary>AI提示词 / 快速粘贴</summary>
<div class="help">把课表图片发给豆包/Kimi/通义/ChatGPT，再复制下面提示词。AI输出后粘贴到输入框，点“解析到课表”。</div>
<textarea id="aiPrompt" readonly>请识别课程表图片，并严格按照左侧“节次”栏输出课程。

要求：
1. 只输出有课节次，空白不输出。
2. 节次必须与图片左侧栏对应，不能顺延。
3. 星期统一写：星期一～星期五。
4. 节次按图片原样写，例如：晨读、第1节～第8节、自主1～自主3、晚1～晚4。
5. 保留完整班级名称和括号，例如：初一(1)语文。
6. 每节课单独一行。
7. 只输出可直接复制的纯文本，不要解释、不要表格。</textarea>
<button class="btn gray" style="width:100%;margin:8px 0" onclick="copyPrompt()">复制提示词</button>
<label>粘贴AI识别后的课表</label><textarea id="quickInput" placeholder="把AI输出内容粘贴到这里"></textarea>
<button class="btn blue" style="width:100%;margin-top:8px" onclick="parseQuickSchedule()">解析到课表</button></details>

<h3 class="compact-title">我的课表</h3>
<div class="table-wrap"><table class="schedule-table" id="scheduleTable"></table></div>
<div class="actions"><button class="btn green" onclick="saveAll()">保存课表</button><button class="btn gray" onclick="loadAll()">恢复课表</button><button class="btn red" onclick="clearSchedule()">清空课表</button><button class="btn gray" onclick="fillQuickFromSchedule()">表格转文本</button></div>
</details>

<h2>一、请假信息</h2>
<div class="form-panel">
  <div class="form-row single">
    <div class="field"><label>请假人</label><input id="person" placeholder="姓名"></div>
  </div>
  <div class="form-row single">
    <div class="field"><label>请假原因</label><textarea id="reason" placeholder="例如：参加教研会"></textarea></div>
  </div>
  <div class="section-line"></div>
  <div class="form-row">
    <div class="field"><label>请假类型</label><select id="leaveType"><option>公假</option><option>事假</option><option>病假</option><option>婚假</option><option>丧假</option><option>产假</option><option>护理假</option></select></div>
    <div class="field"><label>请假天数</label><select id="daysMode"><option value="auto">自动计算</option><option value="custom">自定义</option></select></div>
  </div>
  <div class="form-row single">
    <div class="field"><label>天数结果</label><input id="days" placeholder="自动计算"></div>
  </div>
  <div class="section-line"></div>
  <div class="form-row">
    <div class="field"><label>开始日期</label><input id="startDate" type="date"></div>
    <div class="field"><label>开始时段</label><select id="startHalf"><option>上午</option><option>下午</option><option>全天</option></select></div>
  </div>
  <div class="form-row">
    <div class="field"><label>开始周次</label><input id="startWeek" placeholder="如：12"></div>
    <div class="field"><label>开始星期</label><input id="startDay" readonly placeholder="自动生成"></div>
  </div>
  <div class="section-line"></div>
  <div class="form-row">
    <div class="field"><label>结束日期</label><input id="endDate" type="date"></div>
    <div class="field"><label>结束时段</label><select id="endHalf"><option>上午</option><option>下午</option><option>全天</option></select></div>
  </div>
  <div class="form-row">
    <div class="field"><label>结束周次</label><input id="endWeek" placeholder="如：12"></div>
    <div class="field"><label>结束星期</label><input id="endDay" readonly placeholder="自动生成"></div>
  </div>
  <div class="section-line"></div>
  <div class="form-row">
    <div class="field"><label>填写日期</label><input id="fillDate" type="date"></div>
    <div class="field"><label>代课周次</label><input id="tableWeek" placeholder="如：12"></div>
  </div>
  <div class="form-row single">
    <div class="field"><label>教务处签字</label><input id="sign" placeholder="可留空"></div>
  </div>
  <button class="btn blue" style="width:100%;margin-top:2px" onclick="autoAddFromSchedule()">根据请假时间，一键加入课表课程</button>
</div>

<h2>二、代课安排</h2>
<div class="grid4"><div><label>星期</label><select id="cday"></select></div><div><label>节次</label><select id="cperiod"></select></div><div><label>班级</label><input id="cls" placeholder="例如：七年级1班"></div><div><label>代课教师</label><input id="teacher" placeholder="例如：李老师"></div></div>
<button class="btn green" style="width:100%;margin-top:8px" onclick="addItem()">添加这一节</button><div id="arrList"></div>
<button class="btn green" style="width:100%;height:60px;margin-top:16px;font-size:20px" onclick="renderSheet();window.print()">生成PDF</button>
</div>
<div class="card preview"><div id="sheet"></div></div>
</div>

<script>
let daysArr=["星期一","星期二","星期三","星期四","星期五"],periods=["晨读","第1节","第2节","第3节","第4节","第5节","第6节","第7节","第8节","自主1","自主2","自主3"],schedule={},arr=[],cnWeek=["日","一","二","三","四","五","六"],weekdayMap={"一":"星期一","二":"星期二","三":"星期三","四":"星期四","五":"星期五","六":"星期六","日":"星期日"};
function emptySchedule(){let s={};daysArr.forEach(d=>s[d]={});return s}function v(id){return document.getElementById(id).value.trim()}function setv(id,val){document.getElementById(id).value=val}schedule=emptySchedule();
function renderPeriods(){document.getElementById("periodList").innerHTML=periods.map((p,i)=>`<span class="tag">${p} <button onclick="removePeriod(${i})" style="border:0;background:transparent;color:#b91c1c;font-weight:900">×</button></span>`).join("");renderScheduleTable();renderSelects();renderSheet()}
function addPeriod(){let p=v("newPeriod");if(!p)return alert("请输入节次名称");if(periods.includes(p))return alert("这个节次已经有了");periods.push(p);setv("newPeriod","");renderPeriods();saveAll(false)}
function removePeriod(i){if(!confirm("确定删除这个节次吗？对应课程也会删除。"))return;let p=periods[i];periods.splice(i,1);daysArr.forEach(d=>{if(schedule[d])delete schedule[d][p]});renderPeriods();saveAll(false)}
function resetPeriods(){if(!confirm("恢复默认节次会清空现有课表，确定吗？"))return;periods=["晨读","第1节","第2节","第3节","第4节","第5节","第6节","第7节","第8节","自主1","自主2","自主3"];schedule=emptySchedule();renderPeriods()}
function renderScheduleTable(){let html='<tr><th>节次</th>'+daysArr.map(d=>`<th>${d}</th>`).join("")+'</tr>';periods.forEach(p=>{html+=`<tr><th>${p}</th>`;daysArr.forEach(d=>{let val=schedule[d]&&schedule[d][p]?schedule[d][p]:"";html+=`<td><input data-day="${d}" data-period="${p}" value="${val}"></td>`});html+='</tr>'});document.getElementById("scheduleTable").innerHTML=html}
function collectSchedule(){let ns=emptySchedule();document.querySelectorAll("#scheduleTable input").forEach(inp=>{let d=inp.dataset.day,p=inp.dataset.period,val=inp.value.trim();if(val)ns[d][p]=val});schedule=ns}
function renderSelects(){document.getElementById("cday").innerHTML=daysArr.map(d=>`<option>${d}</option>`).join("");document.getElementById("cperiod").innerHTML=periods.map(p=>`<option>${p}</option>`).join("")}
function copyPrompt(){navigator.clipboard.writeText(v("aiPrompt")).then(()=>alert("提示词已复制"))}
function normalizeDay(s){if(/星期一|周一/.test(s))return"星期一";if(/星期二|周二/.test(s))return"星期二";if(/星期三|周三/.test(s))return"星期三";if(/星期四|周四/.test(s))return"星期四";if(/星期五|周五/.test(s))return"星期五";return""}
function normalizePeriod(s){let t=s.replace(/\s+/g,"");if(/晨读|早读|早自习/.test(t))return"晨读";for(let p of periods){if(t.includes(p))return p}let m=t.match(/第?([1-9])节?/);if(m)return`第${m[1]}节`;return""}
function cleanCourse(line,p){let c=line.replace(/星期[一二三四五]|周[一二三四五]|[:：]/g," ");if(p==="晨读")c=c.replace(/晨读|早读|早自习/g," ");else c=c.replace(p," ");return c.trim().replace(/\s+/g,"")}
function parseQuickSchedule(){let text=v("quickInput");if(!text)return alert("请先粘贴课表内容");let ns=emptySchedule(),currentDay="",count=0;text.split(/\n+/).forEach(raw=>{let line=raw.trim();if(!line)return;let d=normalizeDay(line);if(d){currentDay=d;line=line.replace(/星期[一二三四五]|周[一二三四五]|[:：]/g," ").trim();if(!line)return}let p=normalizePeriod(line);if(currentDay&&p){let c=cleanCourse(line,p);if(c){ns[currentDay][p]=c;count++}}});schedule=ns;renderScheduleTable();alert(count?`已解析${count}节课，请检查后保存。`:"没有解析到课程，请检查格式。")}
function fillQuickFromSchedule(){collectSchedule();let lines=[];daysArr.forEach(d=>{let tmp=[];periods.forEach(p=>{if(schedule[d][p])tmp.push(`${p} ${schedule[d][p]}`)});if(tmp.length){lines.push(`${d}：`,...tmp,"")}});setv("quickInput",lines.join("\n").trim())}
function datePart(s){if(!s)return{m:"",d:""};let a=s.split("-");return{m:String(Number(a[1])),d:String(Number(a[2]))}}function getWeekday(s){if(!s)return"";return cnWeek[new Date(s+"T00:00:00").getDay()]}
function countWorkdays(s,e){let start=new Date(s+"T00:00:00"),end=new Date(e+"T00:00:00");if(isNaN(start)||isNaN(end)||end<start)return 0;let c=0,cur=new Date(start);while(cur<=end){let d=cur.getDay();if(d!==0&&d!==6)c++;cur.setDate(cur.getDate()+1)}return c}
function autoCalcDays(){if(v("daysMode")==="custom")return;let s=v("startDate"),e=v("endDate");if(!s||!e)return;let sh=v("startHalf"),eh=v("endHalf"),sd=new Date(s+"T00:00:00"),ed=new Date(e+"T00:00:00");if(ed<sd){setv("days","");return}let r=0;if(s===e){if(sh==="全天"||eh==="全天"||(sh==="上午"&&eh==="下午"))r=1;else r=.5}else{r=countWorkdays(s,e);if(sh==="下午")r-=.5;if(eh==="上午")r-=.5;if(r<0)r=0}setv("days",String(r))}
function updateDates(){setv("startDay",getWeekday(v("startDate")));setv("endDay",getWeekday(v("endDate")));autoCalcDays();renderSheet()}
function halfPeriods(half){if(half==="上午")return periods.filter(p=>p==="晨读"||/^第[1-4]节$/.test(p));if(half==="下午")return periods.filter(p=>/^第[5-8]节$/.test(p)||/^自主/.test(p)||/^晚/.test(p));return periods}
function dateRangeDays(s,e){let list=[],cur=new Date(s+"T00:00:00"),end=new Date(e+"T00:00:00");while(cur<=end){let w=cnWeek[cur.getDay()];if(weekdayMap[w])list.push({date:new Date(cur),day:weekdayMap[w]});cur.setDate(cur.getDate()+1)}return list}
function ymd(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function periodsForDate(obj,s,e){let id=ymd(obj.date);if(s===e){if(v("startHalf")==="全天"||v("endHalf")==="全天")return periods;if(v("startHalf")===v("endHalf"))return halfPeriods(v("startHalf"));return periods}if(id===s)return v("startHalf")==="下午"?halfPeriods("下午"):periods;if(id===e)return v("endHalf")==="上午"?halfPeriods("上午"):periods;return periods}
function autoAddFromSchedule(){collectSchedule();let s=v("startDate"),e=v("endDate");if(!s||!e)return alert("请先选择请假日期");let count=0;dateRangeDays(s,e).forEach(obj=>{periodsForDate(obj,s,e).forEach(p=>{let c=schedule[obj.day]&&schedule[obj.day][p];if(c){let item={day:obj.day,period:p,cls:c,teacher:""},idx=arr.findIndex(x=>x.day===item.day&&x.period===item.period);if(idx>=0)arr[idx]=item;else arr.push(item);count++}})});renderArr();renderSheet();alert(count?`已加入${count}节课，请填写代课教师。`:"该时段课表里没有课程。")}
function addItem(){let item={day:v("cday"),period:v("cperiod"),cls:v("cls"),teacher:v("teacher")};if(!item.cls&&!item.teacher)return alert("请填写班级或代课教师");let idx=arr.findIndex(x=>x.day===item.day&&x.period===item.period);if(idx>=0)arr[idx]=item;else arr.push(item);setv("cls","");setv("teacher","");renderArr();renderSheet()}
function renderArr(){document.getElementById("arrList").innerHTML=arr.map((x,i)=>`<div class="item"><span>${x.day} ${x.period} ${x.cls}</span><input placeholder="代课教师" value="${x.teacher}" oninput="arr[${i}].teacher=this.value;renderSheet()"><button class="del" onclick="arr.splice(${i},1);renderArr();renderSheet()">删除</button></div>`).join("")}
function getCell(day,p,type){let x=arr.find(a=>a.day===day&&a.period===p);if(!x)return"";return type==="class"?x.cls:x.teacher}function checkType(t){return v("leaveType")===t?"☑":"□"}
function renderSheet(){let sd=datePart(v("startDate")),ed=datePart(v("endDate")),fd=datePart(v("fillDate")),rows="";daysArr.forEach(day=>{rows+=`<tr><td rowspan="2">${day}</td><td>班级</td>`;periods.forEach(p=>rows+=`<td>${getCell(day,p,"class")}</td>`);rows+=`</tr><tr><td>代课教师</td>`;periods.forEach(p=>rows+=`<td>${getCell(day,p,"teacher")}</td>`);rows+=`</tr>`});document.getElementById("sheet").innerHTML=`<h1>代课单</h1><div class="p">学校领导：</div><div class="p indent">本人确因 <span class="u long">${v("reason")}</span>，特请（${checkType("公假")}公、${checkType("事假")}事、${checkType("病假")}病、${checkType("婚假")}婚、${checkType("丧假")}丧、${checkType("产假")}产、${checkType("护理假")}护理）假 <span class="u short">${v("days")}</span> 天。请假时间：<span class="u long">${sd.m?sd.m+"."+sd.d+v("startHalf"):""}</span>（第 <span class="u short">${v("startWeek")}</span> 周星期 <span class="u short">${v("startDay")}</span>）至 <span class="u long">${ed.m?ed.m+"."+ed.d+v("endHalf"):""}</span>（第 <span class="u short">${v("endWeek")}</span> 周星期 <span class="u short">${v("endDay")}</span>）止。望准假！（住院病必须提供住院相关依据，<span class="note">请假人自己安排好班级代课老师，出现缺代记请假人的课。</span>）</div><div class="p">教务处签字：<span class="u long">${v("sign")}</span></div><div class="sign p"><span>请假人：<span class="u mid">${v("person")}</span></span><span>${fd.m?fd.m+" 月 "+fd.d+" 日":""}</span></div><div class="p">请假人代课人员安排表：第 <span class="u short">${v("tableWeek")}</span> 周</div><table><tr><th style="width:56px">星期<br>节次</th><th style="width:58px"></th>${periods.map(p=>`<th>${p}</th>`).join("")}</tr>${rows}</table>`}
function saveAll(show=true){collectSchedule();localStorage.setItem("dynamicScheduleData",JSON.stringify({periods,schedule}));if(show)alert("已保存")}function loadAll(){let raw=localStorage.getItem("dynamicScheduleData");if(!raw)return alert("没有保存记录");let data=JSON.parse(raw);periods=data.periods||periods;schedule=data.schedule||emptySchedule();renderPeriods()}function clearSchedule(){if(!confirm("确定清空课表吗？"))return;schedule=emptySchedule();renderScheduleTable();saveAll(false)}
["startDate","endDate","startHalf","endHalf","daysMode","leaveType","reason","days","person","sign","startWeek","endWeek","fillDate","tableWeek"].forEach(id=>{document.getElementById(id).addEventListener("input",updateDates);document.getElementById(id).addEventListener("change",updateDates)});
(function(){let raw=localStorage.getItem("dynamicScheduleData");if(raw){try{let data=JSON.parse(raw);periods=data.periods||periods;schedule=data.schedule||emptySchedule()}catch(e){}}renderPeriods();renderArr();renderSheet()})();
</script>
</body>
</html>
